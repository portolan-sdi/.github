# The governance rules run against every new issue in the org, so they get
# tested before they ship. The suite fakes the API and asserts on the writes.
name: Issue governance tests

on:
  push:
    branches: [main]
    paths:
      - .github/issue-governance/**
      - .github/workflows/issue-governance.yml
      - .github/workflows/issue-governance-tests.yml
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Run the rule tests
        working-directory: .github/issue-governance
        run: uv run --no-project --with pytest pytest -q test_enforce.py
